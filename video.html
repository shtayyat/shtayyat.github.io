<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  #unmute {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    border: 0; border-radius: 20px; padding: 10px 16px;
    font: 600 13px inherit; font-family: inherit;
    background: rgba(0,0,0,.72); color: #fff;
  }
</style>
</head>
<body>

<iframe
  id="player"
  title="Video"
  src="https://www.youtube.com/embed/RbOsGXc67RE?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1"
  allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
  allowfullscreen></iframe>

<button id="unmute" type="button">Tap for sound</button>

<script>
(function () {
  var frame = document.getElementById('player');
  var btn   = document.getElementById('unmute');

  function cmd(func) {
    try {
      frame.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: func, args: [] }), '*');
    } catch (e) {}
  }

  btn.addEventListener('click', function () {
    cmd('unMute');
    cmd('playVideo');
    btn.style.display = 'none';
  });

  frame.addEventListener('load', function () {
    try {
      frame.contentWindow.postMessage(
        JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*');
    } catch (e) {}
  });

  window.addEventListener('message', function (e) {
    if (typeof e.data !== 'string') return;
    var d;
    try { d = JSON.parse(e.data); } catch (err) { return; }
    if (d && d.event === 'onStateChange' && d.info === 0) {
      try { window.parent.postMessage('video-ended', '*'); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
